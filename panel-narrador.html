<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Secreto del Narrador</title>
    <style>
        * { box-sizing: border-box; }
        body {
            background-color: #080808;
            color: #d1d1d1;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        header {
            background-color: #121212;
            border-bottom: 2px solid #8b0000;
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }
        h1 {
            color: #8b0000;
            font-size: 1.2em;
            margin: 0;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .controls-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .btn {
            background-color: #1a1a1a;
            color: #ccc;
            border: 1px solid #333;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.85em;
            font-weight: bold;
        }
        .btn:hover { background-color: #2a2a2a; }
        .btn-action { background-color: #8b0000; color: white; border: none; }
        .btn-action:hover { background-color: #a00000; }
        
        .btn-toggle.active {
            background-color: #8b0000;
            color: #fff;
            border-color: #ff4d4d;
        }
        
        select.btn {
            outline: none;
            background-color: #1a1a1a;
        }

        .main-layout {
            display: flex;
            flex: 1;
            overflow: hidden;
        }
        
        .sidebar {
            width: 320px;
            background-color: #0f0f0f;
            border-right: 1px solid #222;
            overflow-y: auto;
            padding: 10px;
        }
        .ficha-item {
            background-color: #161616;
            border: 1px solid #2a2a2a;
            border-left: 4px solid #444;
            border-radius: 4px;
            padding: 10px;
            margin-bottom: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .ficha-item:hover {
            background-color: #202020;
            border-color: #555;
        }
        .ficha-item.active {
            border-left-color: #8b0000;
            background-color: #251010;
        }
        .item-id {
            font-size: 0.8em;
            color: #ff4d4d;
            font-weight: bold;
        }
        .item-nombre {
            font-size: 0.95em;
            font-weight: bold;
            color: #eee;
            margin: 2px 0;
        }
        .item-detalles {
            font-size: 0.75em;
            color: #888;
        }

        .viewport {
            flex: 1;
            background-color: #000;
            display: flex;
            flex-direction: column;
            position: relative;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            background-color: #0b0c10;
        }
        .placeholder-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #444;
            font-style: italic;
        }
    </style>
</head>
<body>

    <header>
        <h1>Panel Secreto del Narrador</h1>
        
        <div class="controls-group">
            <button class="btn btn-action" onclick="cargarDatos()">Actualizar Datos</button>
            
            <select id="select-sistema" class="btn" onchange="cambiarSistema()">
                <option value="todos">Mostrar TODOS los Sistemas</option>
                <option value="vampiro" selected>Sistema: Vampiro</option>
                <option value="mago">Sistema: Mago</option>
                <option value="kueijin">Sistema: Kuei-Jin</option>
            </select>

            <button id="btn-borradores" class="btn btn-toggle active" onclick="filtrarEstado('borrador')">Borradores</button>
            <button id="btn-finalizados" class="btn btn-toggle" onclick="filtrarEstado('finalizado')">Finalizados</button>
            <button id="btn-todos-estados" class="btn btn-toggle" onclick="filtrarEstado('todos')">Todos</button>
        </div>
    </header>

    <div class="main-layout">
        <div class="sidebar" id="lista-fichas">
            <div class="placeholder-text" style="position:static; transform:none; padding:20px;">Cargando lista...</div>
        </div>

        <div class="viewport">
            <div id="no-selection" class="placeholder-text">Selecciona una ficha de la izquierda para visualizarla</div>
            <iframe id="frame-ficha" src="" style="display:none;"></iframe>
        </div>
    </div>

    <script>
        // ----------------------------------------------------
        // VALIDACIÓN DE SEGURIDAD (INICIO)
        // ----------------------------------------------------
        (function verificarAccesoNarrador() {
            const urlParams = new URLSearchParams(window.location.search);
            const tokenUrl = urlParams.get("auth");
            const tokenSession = sessionStorage.getItem("narrador_auth");
            const tokenFinal = tokenUrl || tokenSession;

            if (!tokenFinal) {
                alert("Acceso denegado: Debes iniciar sesión en el foro.");
                window.location.href = "https://ecosdelnovenoumbral.foroactivo.com/";
                return;
            }

            try {
                if (tokenUrl && !tokenSession) {
                    sessionStorage.setItem("narrador_auth", tokenUrl);
                }
                const decodedData = atob(tokenFinal).split(":");
                console.log("Narrador autenticado con ID:", decodedData[0], "Usuario:", decodedData[1]);
            } catch (e) {
                alert("Acceso denegado: Token de sesión inválido.");
                window.location.href = "https://ecosdelnovenoumbral.foroactivo.com/";
            }
        })();
        // ----------------------------------------------------

        const databaseURL = "https://ecosnovenoumbral-default-rtdb.firebaseio.com";
        let baseDatosCompleta = {};
        let sistemaActual = "vampiro";
        let estadoActual = "borrador";
        let idFichaSeleccionada = null;

        async function cargarDatos() {
            const contenedorLista = document.getElementById('lista-fichas');
            contenedorLista.innerHTML = '<div style="color:#888; padding:10px;">Consultando Firebase...</div>';

            try {
                const response = await fetch(`${databaseURL}/fichas.json`);
                baseDatosCompleta = await response.json() || {};
                renderizarLista();
            } catch (error) {
                contenedorLista.innerHTML = `<div style="color:red; padding:10px;">Error al conectar: ${error.message}</div>`;
            }
        }

        function cambiarSistema() {
            sistemaActual = document.getElementById('select-sistema').value;
            idFichaSeleccionada = null;
            ocultarVisor();
            renderizarLista();
        }

        function filtrarEstado(estado) {
            estadoActual = estado;
            document.getElementById('btn-borradores').classList.toggle('active', estado === 'borrador');
            document.getElementById('btn-finalizados').classList.toggle('active', estado === 'finalizado');
            document.getElementById('btn-todos-estados').classList.toggle('active', estado === 'todos');
            idFichaSeleccionada = null;
            ocultarVisor();
            renderizarLista();
        }

        function aplanarFichas(objeto, prefijo = '') {
            let resultado = [];
            for (let key in objeto) {
                if (!objeto.hasOwnProperty(key)) continue;
                let item = objeto[key];
                if (typeof item === 'object' && item !== null) {
                    if (item.nombre || item.nombrePersonaje || item.jugador || item.usuario || item.clan) {
                        resultado.push({ id: prefijo ? `${prefijo}/${key}` : key, data: item });
                    } else {
                        resultado = resultado.concat(aplanarFichas(item, prefijo ? `${prefijo}/${key}` : key));
                    }
                }
            }
            return resultado;
        }

        function renderizarLista() {
            const contenedorLista = document.getElementById('lista-fichas');
            contenedorLista.innerHTML = '';

            const listaAplanada = aplanarFichas(baseDatosCompleta);
            let elementosEncontrados = 0;

            listaAplanada.forEach(e => {
                const idRuta = e.id;
                const ficha = e.data;

                let perteneceAlSistema = false;
                if (sistemaActual === 'todos') {
                    perteneceAlSistema = true;
                } else {
                    perteneceAlSistema = idRuta.toLowerCase().includes(sistemaActual) || 
                                         (ficha.sistema && ficha.sistema.toLowerCase() === sistemaActual);
                }

                const esFinalizado = ficha.estado === 'enviado' || ficha.finalizado === true || ficha.enviado === true;
                let coincideEstado = false;
                if (estadoActual === 'todos') coincideEstado = true;
                else if (estadoActual === 'finalizado') coincideEstado = esFinalizado;
                else if (estadoActual === 'borrador') coincideEstado = !esFinalizado;

                if (perteneceAlSistema && coincideEstado) {
                    elementosEncontrados++;
                    
                    const idLimpio = idRuta.includes('/') ? idRuta.split('/').pop() : idRuta;
                    
                    const item = document.createElement('div');
                    item.className = `ficha-item ${idLimpio === idFichaSeleccionada ? 'active' : ''}`;
                    
                    const nombre = ficha.nombre || ficha.nombrePersonaje || 'Sin Nombre';
                    const clan = ficha.clan || 'Sin Clan';
                    const jugador = ficha.jugador || ficha.usuario || 'Desconocido';

                    item.innerHTML = `
                        <div class="item-id">${idLimpio}</div>
                        <div class="item-nombre">${nombre}</div>
                        <div class="item-detalles">Clan: ${clan} | Jugador: ${jugador}</div>
                    `;

                    item.onclick = (evt) => seleccionarFicha(idLimpio, idRuta, evt.currentTarget);
                    contenedorLista.appendChild(item);
                }
            });

            if (elementosEncontrados === 0) {
                contenedorLista.innerHTML = `
                    <div style="color:#aaa; padding:15px; text-align:center; font-size:0.9em;">
                        📂 No se encontraron fichas en esta sección.
                    </div>
                `;
            }
        }

        function seleccionarFicha(idLimpio, idRuta, elemento) {
            idFichaSeleccionada = idLimpio;
            
            document.querySelectorAll('.ficha-item').forEach(el => el.classList.remove('active'));
            if(elemento) elemento.classList.add('active');

            let vistaHTML = "index-vampire.html";
            if (idRuta.toLowerCase().includes("mago") || sistemaActual === "mago") vistaHTML = "index-mage.html";
            if (idRuta.toLowerCase().includes("kueijin") || sistemaActual === "kueijin") vistaHTML = "index-kueijin.html";

            const frame = document.getElementById('frame-ficha');
            const placeholder = document.getElementById('no-selection');

            placeholder.style.display = 'none';
            frame.style.display = 'block';
            
            frame.src = `${vistaHTML}?id=${encodeURIComponent(idLimpio)}`;
        }

        function ocultarVisor() {
            document.getElementById('frame-ficha').style.display = 'none';
            document.getElementById('no-selection').style.display = 'block';
        }

        cargarDatos();
    </script>
</body>
</html>

<script>
        const databaseURL = "https://ecosnovenoumbral-default-rtdb.firebaseio.com";

        async function cargarFichas() {
            const contenedor = document.getElementById('fichas-lista');
            contenedor.innerHTML = 'Consultando base de datos...';

            try {
                // Apuntamos directamente al nodo de vampiro
                const response = await fetch(`${databaseURL}/fichas/vampiro.json`);
                const data = await response.json();

                contenedor.innerHTML = '';

                if (!data) {
                    contenedor.innerHTML = '<p>No hay fichas de vampiro registradas actualmente.</p>';
                    return;
                }

                // Si data es un objeto con fichas
                if (typeof data === 'object') {
                    for (let id in data) {
                        const ficha = data[id];
                        const card = document.createElement('div');
                        card.className = 'ficha-card';
                        
                        // Extraemos el nombre si existe en la ficha, si no mostramos el ID
                        const nombrePersonaje = (typeof ficha === 'object' && ficha.nombre) ? ficha.nombre : 'Personaje';

                        card.innerHTML = `
                            <div class="ficha-header">VAMPIRO | ID: ${id} ${nombrePersonaje !== 'Personaje' ? '- ' + nombrePersonaje : ''}</div>
                            <pre>${JSON.stringify(ficha, null, 2)}</pre>
                        `;
                        contenedor.appendChild(card);
                    }
                } else {
                    contenedor.innerHTML = `<pre>${JSON.stringify(data, null, 2)}</pre>`;
                }

            } catch (error) {
                contenedor.innerHTML = `<p style="color: red;">Error al conectar con Firebase: ${error.message}</p>`;
            }
        }

        // Cargar automáticamente al abrir la página
        cargarFichas();
    </script>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vampire: El Sabbat - Ficha de Personaje</title>
    <!-- Importar los scripts de Firebase (versión compat para fácil uso) -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <style>
        :root {
            --bg-color: #050505;
            --panel-bg: #121212;
            --accent-color: #a93226;
            --text-color: #e0e0e0;
            --border-color: #333;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: Georgia, serif;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: var(--panel-bg);
            border: 2px solid var(--accent-color);
            padding: 20px;
            border-radius: 5px;
        }
        h1 {
            text-align: center;
            color: var(--accent-color);
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        .firebase-panel {
            background: #1a1a1a;
            border: 1px solid var(--border-color);
            padding: 15px;
            margin-bottom: 20px;
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }
        .firebase-panel input {
            background: #050505;
            border: 1px solid var(--border-color);
            color: #fff;
            padding: 8px;
            font-size: 14px;
            border-radius: 3px;
            flex-grow: 1;
        }
        .firebase-btn {
            background: var(--accent-color);
            color: #fff;
            border: none;
            padding: 8px 15px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 3px;
            text-transform: uppercase;
        }
        .firebase-btn:hover {
            opacity: 0.9;
        }
        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 15px;
        }
        .field-group {
            display: flex;
            flex-direction: column;
        }
        .field-group label {
            font-size: 13px;
            color: #aaa;
            margin-bottom: 3px;
        }
        .field-group input {
            background: #050505;
            border: 1px solid var(--border-color);
            color: #fff;
            padding: 6px;
            border-radius: 3px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Vampire: El Sabbat</h1>

        <!-- Panel de Control Firebase -->
        <div class="firebase-panel">
            <span>ID del Personaje:</span>
            <input type="text" id="idPersonaje" placeholder="Ej: sabbat-nigoyin-001">
            <button class="firebase-btn" onclick="guardarFicha()">Guardar en Firebase</button>
            <button class="firebase-btn" onclick="cargarFicha()">Cargar de Firebase</button>
        </div>

        <!-- Datos Básicos -->
        <div class="grid-2">
            <div class="field-group">
                <label>Nombre del Personaje</label>
                <input type="text" id="nombre">
            </div>
            <div class="field-group">
                <label>Jugador</label>
                <input type="text" id="jugador">
            </div>
        </div>

        <div class="grid-2">
            <div class="field-group">
                <label>Naturaleza</label>
                <input type="text" id="naturaleza">
            </div>
            <div class="field-group">
                <label>Conducta</label>
                <input type="text" id="conducta">
            </div>
        </div>

        <div class="grid-2">
            <div class="field-group">
                <label>Clan</label>
                <input type="text" id="clan">
            </div>
            <div class="field-group">
                <label>Generación</label>
                <input type="text" id="generacion" value="13">
            </div>
        </div>
    </div>

    <!-- Script de Configuración y Lógica de Firebase -->
    <script>
        // Configuración oficial de tu Firebase
        const firebaseConfig = {
            databaseURL: "https://ecosnovenumbral-default-rtdb.firebaseio.com"
        };

        // Inicializar Firebase
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.database();

        // Función para Guardar la Ficha
        function guardarFicha() {
            const idPersonaje = document.getElementById('idPersonaje').value.trim();
            if (!idPersonaje) {
                alert("Por favor, ingresa un ID de Personaje válido antes de guardar.");
                return;
            }

            const datosFicha = {
                nombre: document.getElementById('nombre').value,
                jugador: document.getElementById('jugador').value,
                naturaleza: document.getElementById('naturaleza').value,
                conducta: document.getElementById('conducta').value,
                clan: document.getElementById('clan').value,
                generacion: document.getElementById('generacion').value
            };

            db.ref('fichas/' + idPersonaje).set(datosFicha, (error) => {
                if (error) {
                    alert("Error al guardar: " + error.message);
                } else {
                    alert("¡Ficha guardada con éxito en Firebase!");
                }
            });
        }

        // Función para Cargar la Ficha
        function cargarFicha() {
            const idPersonaje = document.getElementById('idPersonaje').value.trim();
            if (!idPersonaje) {
                alert("Por favor, ingresa el ID del personaje que deseas cargar.");
                return;
            }

            db.ref('fichas/' + idPersonaje).once('value').then((snapshot) => {
                const data = snapshot.val();
                if (data) {
                    document.getElementById('nombre').value = data.nombre || '';
                    document.getElementById('jugador').value = data.jugador || '';
                    document.getElementById('naturaleza').value = data.naturaleza || '';
                    document.getElementById('conducta').value = data.conducta || '';
                    document.getElementById('clan').value = data.clan || '';
                    document.getElementById('generacion').value = data.generacion || '13';
                    alert("¡Ficha cargada con éxito!");
                } else {
                    alert("No se encontró ninguna ficha registrada con ese ID.");
                }
            }).catch((error) => {
                alert("Error al cargar: " + error.message);
            });
        }
    </script>
</body>
</html>
